# Builds, tests and audits every formula from source on Linux and macOS.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formulae:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Taps this repository (the pull request's version of it).
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
      - run: brew install --build-from-source brnrhq/tap/brnr brnrhq/tap/brnr-claude-adapter brnrhq/tap/brnr-codex-adapter brnrhq/tap/brnr-muse-adapter
      - run: brew test brnrhq/tap/brnr brnrhq/tap/brnr-claude-adapter brnrhq/tap/brnr-codex-adapter brnrhq/tap/brnr-muse-adapter
      - run: brew audit --strict brnrhq/tap/brnr brnrhq/tap/brnr-claude-adapter brnrhq/tap/brnr-codex-adapter brnrhq/tap/brnr-muse-adapter
      # brnr finds the adapters linked next to it (brnr 0.2.0 checks for the npm names; later ones for both).
      - run: env BRNR_DIR="$RUNNER_TEMP/run" BRNR_HOME="$RUNNER_TEMP/home" brnr doctor
