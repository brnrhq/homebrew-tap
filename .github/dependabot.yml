# Pull requests when an action the workflows use has a new release. The
# actions are pinned to commit SHAs with the version in a comment, which
# Dependabot moves together. The formulae are moved by brnr's release
# workflow, not here.
#
# Each waits a week after a release before proposing it (cooldown), so that a
# compromised release is likelier to be caught and pulled first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: actions
